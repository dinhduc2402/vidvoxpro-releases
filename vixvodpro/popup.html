<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>VidVoxPro Bridge</title>
  <link rel="icon" type="image/png" href="icons/icon-32.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #0e100c;
      --surface:        #151812;
      --card:           #1b2018;
      --card-hover:     #22281e;
      --border:         #2b3323;
      --border-subtle:  #1e2419;
      --accent:         #cfff04;
      --accent-hover:   #b8e900;
      --accent-dim:     #516600;
      --accent-purple:  #c084fc;
      --green:          #4ade80;
      --red:            #f87171;
      --yellow:         #fbbf24;
      --text:           #f4f6ee;
      --muted:          #8c9680;
      --font:           -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      --font-mono:      ui-monospace, 'DM Mono', 'Cascadia Code', 'Fira Code', monospace;
    }

    html, body {
      width: 360px;
      min-height: 200px;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(207, 255, 4, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(207, 255, 4, 0.02) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .header-title {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-title .brand-accent {
      color: var(--accent);
    }

    .badge-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(207, 255, 4, 0.12);
      color: var(--accent);
      border: 1px solid rgba(207, 255, 4, 0.25);
    }

    #btn-panel {
      padding: 4px 10px;
      font-family: var(--font);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid var(--accent-dim);
      border-radius: 4px;
      background: rgba(207, 255, 4, 0.1);
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    #btn-panel:hover {
      background: var(--accent);
      color: #141712;
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(207, 255, 4, 0.3);
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px 6px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #log-count {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 9px;
      font-weight: 600;
      color: var(--accent);
    }

    #log-list {
      max-height: 440px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #log-list::-webkit-scrollbar { width: 4px; }
    #log-list::-webkit-scrollbar-track { background: transparent; }
    #log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-empty {
      padding: 24px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .entry {
      border-bottom: 1px solid rgba(43, 51, 35, 0.6);
    }

    .entry-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.12s;
      user-select: none;
    }

    .entry-row:hover {
      background: rgba(207, 255, 4, 0.05);
    }

    .entry-id {
      font-size: 9px;
      color: var(--muted);
      min-width: 54px;
      flex-shrink: 0;
    }

    .entry-type {
      flex: 1;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-purple);
      letter-spacing: 0.04em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-time {
      font-size: 9px;
      color: var(--muted);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .badge-ok   { background: rgba(74, 222, 128, 0.15);  color: var(--green); }
    .badge-fail { background: rgba(248, 113, 113, 0.15); color: var(--red); }
    .badge-proc { background: rgba(251, 191, 36, 0.15);  color: var(--yellow); }

    .expand-icon {
      font-size: 9px;
      color: var(--muted);
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .entry.open .expand-icon { transform: rotate(90deg); }

    .entry-details {
      display: none;
      padding: 0 12px 8px;
      background: var(--surface);
      border-top: 1px dashed var(--border-subtle);
    }

    .entry.open .entry-details { display: block; }

    .detail-section {
      margin-top: 6px;
    }

    .detail-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .detail-value {
      font-size: 9px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 6px;
      word-break: break-all;
      white-space: pre-wrap;
      max-height: 80px;
      overflow-y: auto;
    }

    .detail-value.url {
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: none;
    }

    .detail-error {
      color: var(--red);
    }

    .footer {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 9px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-brand">
      <img src="icons/icon-32.png" alt="VidVoxPro" class="brand-icon">
      <div class="header-title">VidVox<span class="brand-accent">Pro</span> <span class="badge-tag">Bridge</span></div>
    </div>
    <button id="btn-panel">Side Panel</button>
  </header>

  <div class="log-header">
    Recent Requests
    <span id="log-count">0</span>
  </div>

  <div id="log-list">
    <div class="log-empty">No requests yet</div>
  </div>

  <div class="footer">Click a row to expand details</div>

  <script src="popup.js"></script>
</body>
</html>
